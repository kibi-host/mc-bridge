# The Compose service name is resolvable from the Velocity container.
scaler-url=http://scaler:3001
# Must match QUEUE_API_SECRET, or SCALE_WEBHOOK_SECRET when the former is unset.
queue-api-secret=${QUEUE_API_SECRET}
router-server=router
poll-interval-seconds=5
disconnect-grace-seconds=60
# mc-router's unavailable text. Keep this aligned with AUTO_SCALE_*_MOTD.
unavailable-message-pattern=(?i).*(server is sleeping|server is starting|please wait).*
